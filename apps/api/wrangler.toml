# Chat360 Project Operations — API Worker.
# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   ENTRA_CLIENT_SECRET, TOKEN_ENCRYPTION_KEY, COOKIE_SECRET
# See docs/deployment.md for every variable.
name = "chat360-ops-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"
workers_dev = false

[observability]
enabled = true
head_sampling_rate = 1

# Times are UTC. Defaults assume the org timezone Asia/Kolkata (UTC+5:30):
#   03:30 UTC = 09:00 IST morning reminders and weekly planning
#   13:30 UTC = 19:00 IST end-of-day confirmation check and escalations
#   :15 hourly maintenance (SLA escalation ladder, notification retries, workbook sync retries, transfers)
[triggers]
crons = ["30 3 * * *", "30 13 * * *", "15 * * * *"]

[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "Coordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Coordinator"]

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "chat360_ops_events"

[vars]
ENVIRONMENT = "development"
APP_ORIGIN = "http://localhost:5173"
STORAGE_BACKEND = "graph"
ENTRA_TENANT_ID = ""
ENTRA_CLIENT_ID = ""
ALLOWED_EMAIL_DOMAINS = "chat.io"
BOOTSTRAP_ADMIN_OIDS = ""
GRAPH_DRIVE_ID = ""
ONEDRIVE_ROOT_PATH = "Chat360 Project Operations"
NOTIFICATION_MAILBOX = ""
DEV_AUTH = "disabled"

[env.staging]
name = "chat360-ops-api-staging"
[env.staging.vars]
ENVIRONMENT = "staging"
APP_ORIGIN = "https://staging.chat360-ops.pages.dev"
STORAGE_BACKEND = "graph"
ENTRA_TENANT_ID = ""
ENTRA_CLIENT_ID = ""
ALLOWED_EMAIL_DOMAINS = "chat.io"
BOOTSTRAP_ADMIN_OIDS = ""
GRAPH_DRIVE_ID = ""
ONEDRIVE_ROOT_PATH = "Chat360 Project Operations (Staging)"
NOTIFICATION_MAILBOX = ""
DEV_AUTH = "disabled"
[env.staging.triggers]
crons = ["30 3 * * *", "30 13 * * *", "15 * * * *"]
[[env.staging.durable_objects.bindings]]
name = "COORDINATOR"
class_name = "Coordinator"
[[env.staging.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "chat360_ops_events_staging"

[env.production]
name = "chat360-ops-api-production"
[env.production.vars]
ENVIRONMENT = "production"
APP_ORIGIN = ""
STORAGE_BACKEND = "graph"
ENTRA_TENANT_ID = ""
ENTRA_CLIENT_ID = ""
ALLOWED_EMAIL_DOMAINS = "chat.io"
BOOTSTRAP_ADMIN_OIDS = ""
GRAPH_DRIVE_ID = ""
ONEDRIVE_ROOT_PATH = "Chat360 Project Operations"
NOTIFICATION_MAILBOX = ""
DEV_AUTH = "disabled"
[env.production.triggers]
crons = ["30 3 * * *", "30 13 * * *", "15 * * * *"]
[[env.production.durable_objects.bindings]]
name = "COORDINATOR"
class_name = "Coordinator"
[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "chat360_ops_events"
