# Single-Worker deployment used by Cloudflare Workers Builds (Git-connected, root directory "/").
# One Worker serves the web app as static assets and runs the API for /api/* (ADR-020).
# All data lives in the D1 database below (ADR-021). See docs/deployment.md.
#
# Set these in the Cloudflare dashboard (Worker → Settings → Variables and Secrets);
# `keep_vars` stops deploys from erasing them:
#   APP_ORIGIN (text) and SETUP_CODE (secret, 12+ characters, lets the first admin sign up)
name = "chat360pm"
main = "apps/api/src/index.ts"
compatibility_date = "2025-10-01"
workers_dev = true
keep_vars = true

# Builds the web app before every deploy, so the dashboard build command can stay empty.
[build]
command = "pnpm --filter @chat360/web build"

[assets]
directory = "apps/web/dist"
not_found_handling = "single-page-application"
# Only API calls reach the Worker code; everything else is served from the built web app.
run_worker_first = ["/api/*"]

[observability]
enabled = true
head_sampling_rate = 1

# Times are UTC. Defaults assume the org timezone Asia/Kolkata (UTC+5:30):
#   03:30 UTC = 09:00 IST morning reminders
#   13:30 UTC = 19:00 IST end-of-day confirmation check and escalations
#   :15 hourly maintenance (SLA escalation ladder, notification retries, transfers)
[triggers]
crons = ["30 3 * * *", "30 13 * * *", "15 * * * *"]

[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "Coordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Coordinator"]

# Create the database once (Storage & Databases → D1 → Create, name "chat360pm") and paste its ID here.
[[d1_databases]]
binding = "DB"
database_name = "chat360pm"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Product analytics go to Workers Logs. To use Workers Analytics Engine instead, add an
# [[analytics_engine_datasets]] binding named ANALYTICS.

# Safe constants only. They fail closed: no developer sign-in, no in-memory storage.
[vars]
ENVIRONMENT = "production"
STORAGE_BACKEND = "d1"
DEV_AUTH = "disabled"
